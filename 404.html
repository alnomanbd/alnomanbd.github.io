<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Not Found</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0e1a;color:#eef2ff;font-family:"JetBrains Mono",Consolas,monospace;text-align:center;padding:16px}
  h1{font-size:clamp(4rem,18vw,9rem);margin:0;color:#ff3b4f;text-shadow:0 0 30px rgba(255,59,79,.4)}
  p{color:#9aa6c4} a{color:#ff3b4f;border:1px solid rgba(255,59,79,.5);padding:10px 20px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:16px}
  a:hover{background:rgba(255,59,79,.1)}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>$ cat requested_page<br>cat: No such file or directory</p>
    <p>Either the page moved or you are fuzzing directories. Either way, nothing here.</p>
    <a href="./">cd ~</a>
  </div>
</body>
</html>
